name: SOL paper bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "backtest or paper"
        default: "paper"
        type: choice
        options:
          - paper
          - backtest

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        run: python bot.py ${{ github.event.inputs.mode || 'paper' }}
      - name: Save paper state
        if: ${{ (github.event.inputs.mode || 'paper') == 'paper' }}
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper_state.json
          git diff --staged --quiet || (git commit -m "update paper state" && git push)
